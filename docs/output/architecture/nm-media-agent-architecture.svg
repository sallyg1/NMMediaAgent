<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420" role="img" aria-labelledby="title desc"><title id="title">NMMediaAgent solution architecture</title><desc id="desc">Daily Azure Logic Apps Consumption workflow calls ingestion and synthesis in a single Azure Functions app, stores deduplicated articles in Azure Storage, calls a versioned Microsoft Foundry prompt agent, and sends an HTML digest through Office 365 Outlook. Bing web grounding and storage private networking are optional. Function managed identity and Application Insights with Log Analytics provide access control and host monitoring.</desc><defs><marker id="arrow-0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0078D4" stroke-width="1.5"/></marker><marker id="arrow-5C2D91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5C2D91" stroke-width="1.5"/></marker><marker id="arrow-0C8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0C8599" stroke-width="1.5"/></marker><marker id="arrow-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748B" stroke-width="1.5"/></marker></defs><rect width="1900" height="1420" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, sans-serif"><rect id="nm-000" x="340" y="180" width="1180" height="1120" rx="24" fill="none" stroke="#0078D4" stroke-width="2"/><rect id="nm-001" x="380" y="230" width="1100" height="210" rx="16" fill="none" stroke="#5C2D91" stroke-width="2"/><rect id="nm-002" x="770" y="550" width="300" height="260" rx="16" fill="none" stroke="#0078D4" stroke-width="2"/><rect id="nm-003" x="400" y="1200" width="1050" height="78" rx="16" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="9 7"/><rect id="nm-004" x="60" y="580" width="230" height="104" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-005" x="60" y="710" width="230" height="100" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-006" x="400" y="550" width="290" height="260" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-007" x="790" y="640" width="260" height="68" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-008" x="790" y="726" width="260" height="62" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-009" x="1150" y="550" width="300" height="260" rx="16" fill="#EDF6FD" stroke="#0078D4" stroke-width="2"/><rect id="nm-010" x="1150" y="925" width="300" height="240" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/><rect id="nm-011" x="400" y="925" width="290" height="240" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><rect id="nm-012" x="770" y="925" width="300" height="240" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><rect id="nm-013" x="1580" y="270" width="260" height="230" rx="16" fill="#EFFAFA" stroke="#0C8599" stroke-width="2"/><rect id="nm-014" x="1580" y="940" width="260" height="230" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2" stroke-dasharray="9 7"/><rect id="nm-015" x="405" y="325" width="290" height="80" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/><rect id="nm-016" x="775" y="325" width="290" height="80" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/><rect id="nm-017" x="1145" y="325" width="310" height="80" rx="16" fill="#F4EFFA" stroke="#5C2D91" stroke-width="2"/><polyline id="nm-018" points="695,365 765,365" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)"/><polyline id="nm-019" points="1065,365 1135,365" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)"/><polyline id="nm-020" points="550,411 550,540" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/><polyline id="nm-021" points="920,411 920,490 1300,490 1300,540" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)" marker-start="url(#arrow-5C2D91)"/><polyline id="nm-022" points="1455,365 1570,365" fill="none" stroke="#0C8599" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0C8599)"/><polyline id="nm-023" points="290,632 330,632 330,680" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round"/><polyline id="nm-024" points="290,760 330,760 330,680 390,680" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/><polyline id="nm-025" points="690,680 760,680" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/><polyline id="nm-026" points="1070,680 1140,680" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/><polyline id="nm-027" points="1300,820 1300,915" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-5C2D91)" marker-start="url(#arrow-5C2D91)"/><polyline id="nm-028" points="1450,1045 1570,1045" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)" marker-start="url(#arrow-5C2D91)"/><polyline id="nm-029" points="545,810 545,860 920,860 920,915" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-64748B)"/><polyline id="nm-030" points="1150,770 1110,770 1110,860 920,860" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/><text id="nm-031" x="60" y="80" font-size="44" font-weight="700" fill="#000000"><tspan x="60" dy="0">NMMediaAgent</tspan></text><text id="nm-032" x="60" y="120" font-size="25" font-weight="400" fill="#000000"><tspan x="60" dy="0">New Mexico trend intelligence | Solution architecture</tspan></text><text id="nm-033" x="1410" y="72" font-size="19" font-weight="700" fill="#000000"><tspan x="1410" dy="0">CHECKED-IN IMPLEMENTATION</tspan></text><polyline id="nm-034" points="60,150 112,150" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078D4)"/><text id="nm-035" x="126" y="153" font-size="17" font-weight="400" fill="#000000"><tspan x="126" dy="0">Content / output</tspan></text><polyline id="nm-036" points="340,150 392,150" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-5C2D91)"/><text id="nm-037" x="406" y="153" font-size="17" font-weight="400" fill="#000000"><tspan x="406" dy="0">Workflow call / response</tspan></text><rect id="nm-038" x="730" y="139" width="40" height="22" rx="5" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="9 7"/><text id="nm-039" x="784" y="153" font-size="17" font-weight="400" fill="#000000"><tspan x="784" dy="0">Optional capability</tspan></text><text id="nm-040" x="370" y="210" font-size="19" font-weight="700" fill="#000000"><tspan x="370" dy="0">AZURE COMMERCIAL</tspan></text><rect id="nm-041" x="405" y="249" width="42" height="36" rx="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text id="nm-042" x="413" y="272" font-size="16" font-weight="700" fill="#000000"><tspan x="413" dy="0">LA</tspan></text><text id="nm-043" x="462" y="274" font-size="26" font-weight="700" fill="#000000"><tspan x="462" dy="0">Azure Logic Apps</tspan></text><text id="nm-044" x="462" y="302" font-size="19" font-weight="400" fill="#000000"><tspan x="462" dy="0">Consumption | Daily at 06:00 Mountain Time | Sequential execution</tspan></text><text id="nm-045" x="424" y="359" font-size="21" font-weight="700" fill="#000000" data-region="405,325,290,80"><tspan x="424" dy="0">1  Invoke ingestion</tspan></text><text id="nm-046" x="424" y="385" font-size="16" font-weight="400" fill="#000000" data-region="405,325,290,80"><tspan x="424" dy="0">Call_IngestFeeds</tspan></text><text id="nm-047" x="794" y="359" font-size="21" font-weight="700" fill="#000000" data-region="775,325,290,80"><tspan x="794" dy="0">2  Invoke synthesis</tspan></text><text id="nm-048" x="794" y="385" font-size="16" font-weight="400" fill="#000000" data-region="775,325,290,80"><tspan x="794" dy="0">Call_SynthesizeTrends</tspan></text><text id="nm-049" x="1164" y="359" font-size="21" font-weight="700" fill="#000000" data-region="1145,325,310,80"><tspan x="1164" dy="0">3  Office 365 Outlook</tspan></text><text id="nm-050" x="1164" y="385" font-size="16" font-weight="400" fill="#000000" data-region="1145,325,310,80"><tspan x="1164" dy="0">Send_Outlook_Email</tspan></text><text id="nm-051" x="960" y="474" font-size="16" font-weight="400" fill="#000000"><tspan x="960" dy="0">HTTPS + function key</tspan></text><text id="nm-052" x="1484" y="353" font-size="16" font-weight="400" fill="#000000"><tspan x="1484" dy="0">HTML</tspan></text><text id="nm-053" x="60" y="554" font-size="19" font-weight="700" fill="#000000"><tspan x="60" dy="0">PUBLIC INPUTS</tspan></text><text id="nm-054" x="80" y="616" font-size="23" font-weight="700" fill="#000000" data-region="60,580,230,104"><tspan x="80" dy="0">RSS news</tspan></text><text id="nm-055" x="80" y="651" font-size="18" font-weight="400" fill="#000000" data-region="60,580,230,104"><tspan x="80" dy="0">KRQE, KOB</tspan><tspan x="80" dy="25.2">NM InDepth</tspan></text><text id="nm-056" x="80" y="747" font-size="23" font-weight="700" fill="#000000" data-region="60,710,230,100"><tspan x="80" dy="0">Reddit</tspan></text><text id="nm-057" x="80" y="785" font-size="19" font-weight="400" fill="#000000" data-region="60,710,230,100"><tspan x="80" dy="0">r/NewMexico</tspan></text><text id="nm-058" x="300" y="665" font-size="15" font-weight="400" fill="#000000"><tspan x="300" dy="0">HTTPS</tspan></text><rect id="nm-059" x="420" y="571" width="42" height="36" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text id="nm-060" x="428" y="594" font-size="16" font-weight="700" fill="#000000"><tspan x="428" dy="0">FN</tspan></text><text id="nm-061" x="475" y="595" font-size="18" font-weight="700" fill="#000000" data-region="400,550,290,260"><tspan x="475" dy="0">Azure Functions</tspan></text><text id="nm-062" x="420" y="650" font-size="26" font-weight="700" fill="#000000" data-region="400,550,290,260"><tspan x="420" dy="0">IngestFeeds</tspan></text><text id="nm-063" x="420" y="686" font-size="18" font-weight="400" fill="#000000" data-region="400,550,290,260"><tspan x="420" dy="0">Poll RSS + Reddit</tspan><tspan x="420" dy="25.2">Dedup by source + URL hash</tspan><tspan x="420" dy="25.2">Land unseen articles</tspan></text><text id="nm-064" x="420" y="791" font-size="16" font-weight="400" fill="#000000" data-region="400,550,290,260"><tspan x="420" dy="0">POST /api/ingestfeeds</tspan></text><text id="nm-065" x="790" y="593" font-size="25" font-weight="700" fill="#000000" data-region="770,550,300,260"><tspan x="790" dy="0">Azure Storage</tspan></text><text id="nm-066" x="790" y="622" font-size="18" font-weight="400" fill="#000000" data-region="770,550,300,260"><tspan x="790" dy="0">Entra ID authentication</tspan></text><text id="nm-067" x="806" y="667" font-size="19" font-weight="700" fill="#000000" data-region="790,640,260,68"><tspan x="806" dy="0">Table: urlDedupCache</tspan></text><text id="nm-068" x="806" y="693" font-size="16" font-weight="400" fill="#000000" data-region="790,640,260,68"><tspan x="806" dy="0">Source + SHA-256(URL)</tspan></text><text id="nm-069" x="806" y="751" font-size="19" font-weight="700" fill="#000000" data-region="790,726,260,62"><tspan x="806" dy="0">Blob: raw-landing</tspan></text><text id="nm-070" x="806" y="776" font-size="16" font-weight="400" fill="#000000" data-region="790,726,260,62"><tspan x="806" dy="0">UTC yyyy/MM/dd/ JSON</tspan></text><text id="nm-071" x="693" y="664" font-size="15" font-weight="400" fill="#000000"><tspan x="693" dy="0">Dedup</tspan></text><text id="nm-072" x="699" y="721" font-size="15" font-weight="400" fill="#000000"><tspan x="699" dy="0">+ land</tspan></text><text id="nm-073" x="1078" y="664" font-size="15" font-weight="400" fill="#000000"><tspan x="1078" dy="0">UTC-day</tspan></text><text id="nm-074" x="1080" y="721" font-size="15" font-weight="400" fill="#000000"><tspan x="1080" dy="0">articles</tspan></text><rect id="nm-075" x="1170" y="571" width="42" height="36" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text id="nm-076" x="1178" y="594" font-size="16" font-weight="700" fill="#000000"><tspan x="1178" dy="0">FN</tspan></text><text id="nm-077" x="1225" y="595" font-size="18" font-weight="700" fill="#000000" data-region="1150,550,300,260"><tspan x="1225" dy="0">Azure Functions</tspan></text><text id="nm-078" x="1170" y="650" font-size="26" font-weight="700" fill="#000000" data-region="1150,550,300,260"><tspan x="1170" dy="0">SynthesizeTrends</tspan></text><text id="nm-079" x="1170" y="686" font-size="18" font-weight="400" fill="#000000" data-region="1150,550,300,260"><tspan x="1170" dy="0">Read UTC-day blobs</tspan><tspan x="1170" dy="25.2">Invoke versioned agent</tspan><tspan x="1170" dy="25.2">Resolve source citations</tspan><tspan x="1170" dy="25.2">Return Markdown + HTML</tspan></text><text id="nm-080" x="1170" y="798" font-size="16" font-weight="400" fill="#000000" data-region="1150,550,300,260"><tspan x="1170" dy="0">POST /api/synthesizetrends</tspan></text><text id="nm-081" x="1320" y="863" font-size="17" font-weight="700" fill="#000000"><tspan x="1320" dy="0">Responses API</tspan></text><text id="nm-082" x="1320" y="892" font-size="17" font-weight="400" fill="#000000"><tspan x="1320" dy="0">Articles / digest</tspan></text><rect id="nm-083" x="1170" y="945" width="42" height="36" rx="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text id="nm-084" x="1178" y="968" font-size="16" font-weight="700" fill="#000000"><tspan x="1178" dy="0">AI</tspan></text><text id="nm-085" x="1225" y="971" font-size="22" font-weight="700" fill="#000000" data-region="1150,925,300,240"><tspan x="1225" dy="0">Microsoft Foundry</tspan></text><text id="nm-086" x="1170" y="1023" font-size="21" font-weight="700" fill="#000000" data-region="1150,925,300,240"><tspan x="1170" dy="0">Versioned prompt agent</tspan></text><text id="nm-087" x="1170" y="1061" font-size="18" font-weight="400" fill="#000000" data-region="1150,925,300,240"><tspan x="1170" dy="0">gpt-4.1-mini (default)</tspan><tspan x="1170" dy="25.2">system_prompt.md instructions</tspan><tspan x="1170" dy="25.2">Top 5 ranked trends</tspan><tspan x="1170" dy="25.2">Impact, sentiment, sources</tspan></text><rect id="nm-088" x="1600" y="290" width="42" height="36" rx="8" fill="#CCEEEE" stroke="#0C8599" stroke-width="2"/><text id="nm-089" x="1608" y="313" font-size="16" font-weight="700" fill="#000000"><tspan x="1608" dy="0">@</tspan></text><text id="nm-090" x="1655" y="316" font-size="22" font-weight="700" fill="#000000" data-region="1580,270,260,230"><tspan x="1655" dy="0">Microsoft 365</tspan></text><text id="nm-091" x="1600" y="373" font-size="23" font-weight="700" fill="#000000" data-region="1580,270,260,230"><tspan x="1600" dy="0">Recipient mailbox</tspan></text><text id="nm-092" x="1600" y="410" font-size="17" font-weight="400" fill="#000000" data-region="1580,270,260,230"><tspan x="1600" dy="0">HTML executive digest</tspan><tspan x="1600" dy="23.799999999999997">Target: M365 GCC</tspan><tspan x="1600" dy="23.799999999999997">Authorized sender required</tspan></text><text id="nm-093" x="1580" y="908" font-size="17" font-weight="700" fill="#000000"><tspan x="1580" dy="0">EXTERNAL WEB GROUNDING</tspan></text><text id="nm-094" x="1600" y="981" font-size="22" font-weight="700" fill="#000000" data-region="1580,940,260,230"><tspan x="1600" dy="0">Grounding with Bing</tspan></text><text id="nm-095" x="1600" y="1024" font-size="18" font-weight="400" fill="#000000" data-region="1580,940,260,230"><tspan x="1600" dy="0">Existing Bing resource</tspan><tspan x="1600" dy="25.2">+ project connection</tspan><tspan x="1600" dy="25.2">Public web enrichment</tspan></text><text id="nm-096" x="1600" y="1112" font-size="17" font-weight="700" fill="#000000" data-region="1580,940,260,230"><tspan x="1600" dy="0">Queries leave the Azure</tspan><tspan x="1600" dy="23.799999999999997">compliance boundary</tspan></text><text id="nm-097" x="1462" y="1024" font-size="16" font-weight="400" fill="#000000"><tspan x="1462" dy="0">Optional tool</tspan></text><text id="nm-098" x="651" y="846" font-size="17" font-weight="400" fill="#000000"><tspan x="651" dy="0">Function host telemetry</tspan></text><rect id="nm-099" x="420" y="945" width="42" height="36" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text id="nm-100" x="428" y="968" font-size="16" font-weight="700" fill="#000000"><tspan x="428" dy="0">ID</tspan></text><text id="nm-101" x="475" y="971" font-size="22" font-weight="700" fill="#000000" data-region="400,925,290,240"><tspan x="475" dy="0">Managed identity</tspan></text><text id="nm-102" x="420" y="1023" font-size="18" font-weight="400" fill="#000000" data-region="400,925,290,240"><tspan x="420" dy="0">Function App identity</tspan><tspan x="420" dy="25.2">Storage data roles</tspan><tspan x="420" dy="25.2">Foundry access roles</tspan><tspan x="420" dy="25.2">Storage shared keys disabled</tspan></text><rect id="nm-103" x="790" y="945" width="42" height="36" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text id="nm-104" x="798" y="968" font-size="16" font-weight="700" fill="#000000"><tspan x="798" dy="0">MO</tspan></text><text id="nm-105" x="845" y="971" font-size="22" font-weight="700" fill="#000000" data-region="770,925,300,240"><tspan x="845" dy="0">Monitoring</tspan></text><text id="nm-106" x="790" y="1023" font-size="18" font-weight="400" fill="#000000" data-region="770,925,300,240"><tspan x="790" dy="0">Application Insights</tspan><tspan x="790" dy="25.2">Log Analytics workspace</tspan><tspan x="790" dy="25.2">Function host telemetry</tspan><tspan x="790" dy="25.2">Ingestion / synthesis logging</tspan></text><text id="nm-107" x="420" y="1225" font-size="18" font-weight="700" fill="#000000" data-region="400,1200,1050,78"><tspan x="420" dy="0">OPTIONAL PRIVATE NETWORKING</tspan></text><text id="nm-108" x="420" y="1253" font-size="17" font-weight="400" fill="#000000" data-region="400,1200,1050,78"><tspan x="420" dy="0">Function outbound VNet integration + Private DNS + storage private endpoints (blob / table / queue).</tspan></text><text id="nm-109" x="420" y="1274" font-size="14" font-weight="400" fill="#000000" data-region="400,1200,1050,78"><tspan x="420" dy="0">This template does not make the entire pipeline private.</tspan></text><text id="nm-110" x="60" y="1358" font-size="18" font-weight="400" fill="#000000"><tspan x="60" dy="0">Implementation view, not deployment status. Both HTTP functions share one .NET 10 isolated / Flex Consumption Function App.</tspan></text><text id="nm-111" x="60" y="1390" font-size="17" font-weight="400" fill="#000000"><tspan x="60" dy="0">Model and inputs are configurable. Dashed borders identify optional features; email uses the checked-in Office 365 Outlook connection.</tspan></text></g></svg>